name: Live Mutating Smoke

# Manual only: starting this workflow by hand is the consent the script asks for
# (UYUMSOFT_RUN_MUTATING_TESTS). It always saves drafts and cancels them; the
# send flow stays a local-only run (see docs/testing.md).
on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma separated: efatura, esmm, emm, eirsaliye, eadisyon, edoviz, ebankamakbuzu, egiderpusulasi, ebilet, edefter'
        required: true
        default: 'efatura,esmm,emm,eirsaliye,eadisyon,edoviz,ebankamakbuzu,egiderpusulasi,ebilet,edefter'
      require_all:
        description: 'Fail when a selected service is skipped'
        type: boolean
        default: false

jobs:
  live-mutating:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run guarded mutating smoke against Uyumsoft test
        run: npm run test:live:mutating
        # Falls back to Uyumsoft's public test account (see README) when no secrets are set.
        env:
          UYUMSOFT_USERNAME: ${{ secrets.UYUMSOFT_USERNAME || 'Uyumsoft' }}
          UYUMSOFT_PASSWORD: ${{ secrets.UYUMSOFT_PASSWORD || 'Uyumsoft' }}
          UYUMSOFT_ENV: test
          UYUMSOFT_RUN_MUTATING_TESTS: 'true'
          UYUMSOFT_MUTATING_FLOW: draft
          UYUMSOFT_MUTATING_SERVICES: ${{ inputs.services }}
          UYUMSOFT_REQUIRE_ALL_MUTATING_FIXTURES: ${{ inputs.require_all }}
